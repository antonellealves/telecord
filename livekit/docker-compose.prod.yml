# Deploy do servidor LiveKit numa VM, desacoplado do resto do projeto.
#
# Só o LiveKit roda aqui — TiDB e a API continuam onde já estão (local ou
# Vercel/outro host). Nada neste arquivo depende do compose de
# desenvolvimento na raiz do repo; é o MESMO livekit.yaml que já era usado
# localmente, só que servido atrás de TLS de verdade.
#
# Uso na VM (feito pelo workflow de deploy, ver .github/workflows/deploy.yml):
#   cd /opt/telecord-livekit
#   docker compose -f docker-compose.prod.yml up -d
#
# Variáveis exigidas no .env desta pasta (ver .env.example ao lado):
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_WEBHOOK_URL, LIVEKIT_NODE_IP
#
# TLS não é feito aqui: desde que o transporte `mediasoup` entrou na mesma VM
# (ver mediasoup/docker-compose.prod.yml), as portas 80/443 passaram a ser
# compartilhadas entre os dois processos, e um Caddy por serviço não cabe —
# dois containers não religam a mesma porta do host. O proxy TLS agora é
# ÚNICO para a VM inteira: ver infra/docker-compose.proxy.yml e
# infra/Caddyfile, que rotea por hostname para este container e para o do
# mediasoup. Suba a infra ANTES deste compose (ver infra/README ou o
# workflow de deploy).

services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    entrypoint: sh
    command:
      - -c
      - |
        apk add --no-cache gettext > /dev/null
        envsubst < /etc/livekit.yaml > /tmp/livekit.yaml
        exec /livekit-server --config /tmp/livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?defina no .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?defina no .env}
      LIVEKIT_WEBHOOK_URL: ${LIVEKIT_WEBHOOK_URL:?defina no .env}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:?defina o IP publico da VM no .env}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881" # TCP fallback do ICE
      - "40000-40100:40000-40100/udp" # mídia (RTC)
    networks:
      - telecord-proxy

# Rede EXTERNA, criada uma vez pela infra compartilhada (ver
# infra/docker-compose.proxy.yml) — é por ela que o Caddy único da VM alcança
# `livekit:7880` pelo nome do serviço, sem publicar a porta ao host.
networks:
  telecord-proxy:
    external: true
