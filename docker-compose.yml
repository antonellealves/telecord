# Desenvolvimento local.
#
# Sobe o banco e a API; o front continua no host, com `pnpm dev`. O Vite dentro
# de um bind mount no Windows só detecta alteração com polling, o que gasta CPU
# à toa e ainda deixa o recarregamento lento — e o servidor de desenvolvimento
# do Vite não precisa de nada que só o contêiner ofereça.
#
#   docker compose up            # banco + API
#   pnpm dev                     # front, noutra janela
#
# Uso:
#   1. cp .env.example .env  e preencha o que a seção do serviço de auth pede
#   2. node scripts/gen-auth-keys.mjs      (gera o par de chaves de sessão)
#   3. node scripts/gen-livekit-keys.mjs   (gera a credencial do LiveKit local)
#   4. docker compose up
#
# O link de confirmação de e-mail sai em `docker compose logs -f api`:
# MAIL_DRIVER=log escreve a mensagem inteira no log em vez de enviar, o que
# evita depender de provedor de e-mail para testar cadastro.

services:
  # TiDB de verdade, não MySQL.
  #
  # O protocolo é o mesmo, mas as diferenças que interessam não são de
  # protocolo: AUTO_INCREMENT não monotônico, ausência de foreign key efetiva e
  # a sintaxe de TTL. Desenvolver contra MySQL esconderia justamente o que
  # quebra em produção.
  #
  # `--store=unistore` roda tudo num processo só, sem PD nem TiKV: é o modo de
  # desenvolvimento, sem persistência entre recriações do contêiner.
  tidb:
    image: pingcap/tidb:v8.5.0
    command: ["--store=unistore", "--path=", "--host=0.0.0.0"]
    ports:
      - "4000:4000"
    healthcheck:
      # O TiDB abre a porta antes de aceitar consulta; sem checar de fato, a
      # migration da API corre cedo demais e falha na primeira subida.
      test: ["CMD-SHELL", "/tidb-server -V > /dev/null 2>&1 && (echo > /dev/tcp/127.0.0.1/4000) 2>/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Servidor LiveKit local, autenticado por par de chaves igual ao LiveKit
  # Cloud. Desacoplado de propósito: `livekit/livekit.yaml` é o MESMO arquivo
  # que vai para a VM no dia do deploy, e a imagem é a oficial, sem
  # modificação — só troca o host que a aponta.
  #
  # SEM gravação: não há serviço `egress` neste compose e nenhuma opção de
  # `room_composite`/recording habilitada em livekit.yaml. Ao encerrar a
  # transmissão, o LiveKit não escreveu nenhum byte de mídia em disco — a
  # sala é só sinalização + roteamento de mídia em trânsito.
  livekit:
    image: livekit/livekit-server:v1.13.6
    # A imagem oficial (Alpine) não expande ${VAR} dentro do YAML sozinha e
    # não traz `envsubst` (pacote gettext) pronto — instala na primeira vez
    # que o contêiner sobe (fica em cache de camada). O livekit.yaml montado
    # como :ro nunca é escrito, só lido; a versão com valores reais fica em
    # /tmp, que não é volume.
    entrypoint: sh
    command:
      - -c
      - |
        apk add --no-cache gettext > /dev/null
        envsubst < /etc/livekit.yaml > /tmp/livekit.yaml
        exec /livekit-server --config /tmp/livekit.yaml
    environment:
      # Mesmo par que a API usa para emitir (api/token.ts) e conferir
      # (apps/api/src/livekit/webhook-auth.ts) token — trocar de provedor
      # (Cloud → local → VM) não muda nada do lado da aplicação.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?rode node scripts/gen-livekit-keys.mjs e preencha o .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?rode node scripts/gen-livekit-keys.mjs e preencha o .env}
      # Reusa a MESMA rota que já existe para o LiveKit Cloud — ver
      # apps/api/src/livekit/livekit.controller.ts.
      LIVEKIT_WEBHOOK_URL: http://api:3000/api/livekit/webhook
      # IP que o servidor anuncia nos candidatos ICE — sem isto, o navegador
      # tenta conectar a mídia no IP interno do contêiner e a conexão nunca
      # fecha de verdade (ver livekit/livekit.yaml). Localmente, o IP da
      # máquina na rede (não 127.0.0.1); na VM, o IP público dela.
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:?defina o IP local da maquina no .env, tipo 192.168.0.10}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # sinalização (WebSocket/HTTP)
      - "7881:7881" # TCP fallback do ICE
      - "50000-50100:50000-50100/udp" # mídia (RTC), ver livekit.yaml

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: sh -c "pnpm --filter @telecord/api prisma:migrate && node apps/api/dist/src/main.js"
    depends_on:
      tidb:
        condition: service_healthy
    environment:
      # `root` sem senha e sem TLS é o padrão do TiDB local. Em produção a URL
      # traz usuário com prefixo do cluster e `sslaccept=strict` — ver README.
      DATABASE_URL: mysql://root@tidb:4000/telecord?connection_limit=5
      APP_URL: ${APP_URL:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:3000/api}
      PORT: "3000"
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-Telecord <nao-responda@localhost>}
      # As MESMAS credenciais que a função /api/token usa para EMITIR token.
      # Aqui elas só CONFEREM a assinatura do webhook do LiveKit — o serviço
      # não fala com o SFU, ele confirma que quem falou com ele foi o SFU.
      #
      # Sem elas o webhook responde 503, a tabela de sessões fica vazia e o
      # painel diz que não há dado de conversa. É o modo de desenvolvimento.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      # Fonte montada por cima para `tsc --watch` recompilar sem rebuild da
      # imagem. Os dois volumes anônimos existem para o node_modules e o dist
      # do contêiner não serem tapados pelos do host, que foram instalados para
      # outro sistema operacional.
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - /app/node_modules
      - /app/apps/api/node_modules
