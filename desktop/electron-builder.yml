appId: com.telecord.app
productName: telecord
copyright: Copyright © telecord
directories:
  output: release
  buildResources: build

# Nunca empacota nada do front web — o shell só carrega PROD_URL em
# runtime. `files` restringe o asar ao que o próprio shell precisa.
files:
  - dist/**/*
  # Ícones usados EM EXECUÇÃO (bandeja, janela). Os de `build/` são só para
  # montar o instalador e não entram no pacote.
  - assets/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.map"

# Quem cria o GitHub Release é o workflow (desktop-release.yml), não o
# electron-builder: ele roda com `--publish never`. Este bloco continua aqui
# porque é dele que sai o `app-update.yml` embutido no app, que diz ao
# electron-updater onde procurar a versão nova.
publish:
  provider: github
  owner: antonellealves
  repo: telecord

# Nomes SEM versão: é o que deixa o README apontar para
# releases/latest/download/<arquivo> e o link nunca envelhecer. O
# electron-updater não depende do nome (lê o latest*.yml de cada release).

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: telecord-windows-x64-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # O auto-update no macOS só funciona a partir do .zip; o .dmg é para a
    # primeira instalação.
    - target: zip
      arch: [x64, arm64]
  artifactName: telecord-macos-${arch}.${ext}
  icon: build/icon.icns
  category: public.app-category.social
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarização/assinatura ficam condicionadas à presença dos secrets no
  # workflow (ver .github/workflows/desktop-release.yml) — sem eles, o
  # electron-builder produz um .dmg não assinado normalmente.

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Network
  maintainer: telecord

appImage:
  artifactName: telecord-linux-x64.AppImage

deb:
  artifactName: telecord-linux-x64.deb

dmg:
  sign: false
