name: Deploy

# O deploy automático da Vercel está desligado em vercel.json
# (git.deploymentEnabled: false), que só bloqueia deploy disparado por evento
# do git. Quem publica é este workflow, pela API.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nunca dois deploys de produção ao mesmo tempo. Em PR, cancelar o anterior é
# o que se quer; em produção, não — daí o cancel-in-progress condicional.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # O serviço de autenticação precisa do cliente do Prisma gerado antes de
      # compilar; o build dele já faz `prisma generate`.
      - name: Build do serviço de autenticação
        run: |
          pnpm --filter @telecord/shared build
          pnpm --filter @telecord/api build

      # Sem banco e sem rede: são as regras que quebram calado — senha que
      # valida à toa, token expirado que passa, assinatura de outra chave
      # aceita. Teste que exige cluster não roda aqui e viraria decoração.
      - name: Testes de autenticação
        run: pnpm --filter @telecord/api test

      # Roda sem nenhuma credencial: se o build só passa com segredo presente,
      # é sinal de que algo virou dependência de ambiente sem necessidade.
      - name: Build
        run: pnpm run build

  # As migrações rodam ANTES de publicar, e é o único lugar onde a ordem
  # importa: publicar primeiro colocaria no ar um código que espera tabelas que
  # ainda não existem, e o sintoma seria erro 500 em toda rota que toca o banco.
  #
  # Falhar aqui trava o deploy de propósito. Um banco que recusou a migração é
  # exatamente o banco em que o código novo não deve entrar.
  migrate:
    name: Migra o banco
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Mesmo Environment do deploy: é dele que sai o DATABASE_URL.
    environment:
      name: Production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Só o serviço e o que ele depende: instalar o workspace inteiro aqui
      # seria baixar o SDK do LiveKit e o React para rodar um ALTER TABLE.
      - name: Instala o serviço
        run: pnpm install --frozen-lockfile --filter @telecord/api...

      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            # Sem banco configurado o app roda sem contas, que é um estado
            # legítimo do produto. Pular é o certo; falhar seria exigir banco
            # de quem só quer publicar a sala.
            echo "DATABASE_URL vazia — sem banco configurado, nada a migrar."
            exit 0
          fi
          pnpm --filter @telecord/api exec prisma migrate deploy

  deploy:
    name: Publica em produção
    needs: [verify, migrate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # O nome tem que bater com o Environment configurado no GitHub.
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    # orgId e projectId vêm de .vercel/project.json, versionado no repositório.
    #
    # Cada valor aceita as duas formas: `secrets` tem precedência, `vars` é o
    # fallback. Guardar credencial como *variable* funciona, mas variable é
    # texto plano e NÃO é mascarada nos logs — o lugar de VERCEL_TOKEN e
    # LIVEKIT_API_SECRET é em Environment secrets. Escrito assim, mover os dois
    # para lá não exige tocar neste arquivo.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
    steps:
      # O Actions mascara `secrets` sozinho, mas não mascara `vars`. Enquanto
      # os valores sensíveis estiverem como variables, esta etapa registra o
      # mascaramento à mão para eles não vazarem em log de erro.
      - name: Mascara valores sensíveis
        env:
          MASK_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
          MASK_SECRET: ${{ secrets.LIVEKIT_API_SECRET || vars.LIVEKIT_API_SECRET }}
          MASK_CF_TOKEN: ${{ secrets.CF_REALTIME_APP_TOKEN || vars.CF_REALTIME_APP_TOKEN }}
        run: |
          if [ -n "${MASK_TOKEN:-}" ]; then echo "::add-mask::$MASK_TOKEN"; fi
          if [ -n "${MASK_SECRET:-}" ]; then echo "::add-mask::$MASK_SECRET"; fi
          if [ -n "${MASK_CF_TOKEN:-}" ]; then echo "::add-mask::$MASK_CF_TOKEN"; fi

      - uses: actions/checkout@v5

      # v4, não v5: a partir de v5 o setup-node lê o `packageManager` do
      # package.json e tenta ativar pnpm via Corepack sozinho — e falha porque
      # este runner não tem Corepack habilitado. Este job nunca precisou de
      # pnpm (não há `pnpm/action-setup` aqui, ao contrário de verify/migrate):
      # `vercel-deploy.mjs` só usa o fetch nativo do Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sem CLI da Vercel e sem dependências: o script fala com a API REST
      # usando só o fetch do Node. A CLI resolve a conta antes de qualquer
      # comando, o que exige token de conta; a API aceita token de projeto.
      - name: Sincroniza credenciais e publica
        id: deploy
        env:
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY || vars.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET || vars.LIVEKIT_API_SECRET }}
          VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL || vars.VITE_LIVEKIT_URL }}
          # Server-side, HTTP(S) — não confundir com VITE_LIVEKIT_URL (pública,
          # ws(s)://, usada pelo navegador). api/rooms.ts usa esta para o
          # RoomServiceClient listar salas ativas; sem ela, cai no fallback
          # hardcoded do LiveKit Cloud antigo (packages/shared/src/index.ts) e
          # "SALAS ATIVAS" sempre aparece vazia depois de trocar de servidor.
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL || vars.LIVEKIT_URL }}

          # Autenticação. Todas OPCIONAIS: sem elas o app publicado não tem
          # contas, que é o estado anterior a este recurso.
          #
          # Segredos de verdade — senha do banco, chave que ASSINA, credencial
          # do Google, chave do provedor de e-mail. O lugar delas é em
          # *secrets*, e `vars` entra só como reserva para o caso de estarem
          # guardadas do outro jeito: lido só de um lado, o valor chegaria
          # VAZIO e o serviço recusaria subir com o mesmo sintoma de quem não
          # configurou nada — que foi o que aconteceu aqui.
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.AUTH_JWT_PRIVATE_KEY || vars.AUTH_JWT_PRIVATE_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}

          # Não são segredo. A chave aqui é a PÚBLICA: valida o token, não
          # emite nenhum. O resto é endereço e configuração.
          #
          # `secrets` com `vars` de reserva, e não só `vars`: guardar a chave
          # pública como *secret* funciona igual e é o que acontece quando
          # alguém cola as duas metades do par no mesmo lugar. Lendo só de
          # `vars`, a variável chegaria VAZIA, o serviço recusaria subir por
          # falta dela e o sintoma seria idêntico ao de não ter configurado
          # nada — que é exatamente o buraco em que este deploy caiu.
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.AUTH_JWT_PUBLIC_KEY || vars.AUTH_JWT_PUBLIC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          MAIL_DRIVER: ${{ secrets.MAIL_DRIVER || vars.MAIL_DRIVER }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}
          AUTH_COOKIE_SAMESITE: ${{ secrets.AUTH_COOKIE_SAMESITE || vars.AUTH_COOKIE_SAMESITE }}

          # Cloudflare (Cloudflare Realtime SFU). Opcionais: sem elas o cartão
          # nem aparece. O APP_TOKEN é segredo de verdade — o lugar dele é em
          # secrets, e `vars` entra só como reserva (mascarado na etapa acima).
          CF_REALTIME_ENABLED: ${{ secrets.CF_REALTIME_ENABLED || vars.CF_REALTIME_ENABLED }}
          CF_REALTIME_APP_ID: ${{ secrets.CF_REALTIME_APP_ID || vars.CF_REALTIME_APP_ID }}
          CF_REALTIME_APP_TOKEN: ${{ secrets.CF_REALTIME_APP_TOKEN || vars.CF_REALTIME_APP_TOKEN }}
          CF_REALTIME_MONTHLY_GB_LIMIT: ${{ secrets.CF_REALTIME_MONTHLY_GB_LIMIT || vars.CF_REALTIME_MONTHLY_GB_LIMIT }}
        run: node scripts/vercel-deploy.mjs

      # Fecha o ciclo: sem isto, um deploy "verde" ainda pode estar sem
      # credencial e devolvendo 500 em toda entrada de sala.
      - name: Verifica o deploy
        env:
          URL: ${{ steps.deploy.outputs.url }}
          # Vazia = autenticação não configurada; o passo 3 se pula sozinho.
          AUTH_ON: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          fail=0

          echo "1. POST /api/token deve assinar o token"
          code=$(curl -sS -o /tmp/token.json -w '%{http_code}' --max-time 30 \
            -X POST "$URL/api/token" \
            -H 'content-type: application/json' \
            -d '{"roomId":"ci-smoke","displayName":"CI"}')
          if [ "$code" = "200" ]; then
            echo "   ok (200)"
          else
            echo "::error::/api/token respondeu $code"
            # O corpo de erro nunca carrega credencial — é seguro mostrar.
            cat /tmp/token.json || true
            fail=1
          fi

          echo "2. /sala/:id deve cair no rewrite da SPA"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL/sala/ci-smoke")
          if [ "$code" = "200" ]; then echo "   ok (200)"; else echo "::error::rewrite de SPA respondeu $code"; fail=1; fi

          if [ -n "${AUTH_ON:-}" ]; then
            echo "3. o serviço de autenticação deve responder"
            code=$(curl -sS -o /tmp/prov.json -w '%{http_code}' --max-time 30 "$URL/api/auth/providers")
            if [ "$code" = "200" ]; then
              echo "   ok (200) $(cat /tmp/prov.json)"
            else
              echo "::error::/api/auth/providers respondeu $code"
              cat /tmp/prov.json || true
              fail=1
            fi
          else
            echo "3. autenticação desligada (sem VITE_API_URL) — pulando"
          fi

          echo "4. /api/rooms deve continuar sendo a função das salas ao vivo"
          # Retry: este job (deploy) roda em paralelo com deploy-livekit — os
          # dois só dependem de verify/migrate, de propósito, para não
          # acoplar a publicação da Vercel a um deploy de VM (ver histórico).
          # A consequência é que, quando o LiveKit está no meio do próprio
          # rollout na VM ao mesmo tempo, esta curl pode chegar antes dele
          # voltar a responder — 502 real, porém transitório, não um bug. Dá
          # alguns segundos de chance antes de marcar falha de verdade.
          rooms_ok=0
          for i in $(seq 1 6); do
            code=$(curl -sS -o /tmp/rooms.json -w '%{http_code}' --max-time 30 "$URL/api/rooms")
            if [ "$code" = "200" ]; then
              rooms_ok=1
              break
            fi
            echo "   tentativa $i: $code — LiveKit pode estar no meio do próprio deploy, tentando de novo…"
            sleep 5
          done
          if [ "$rooms_ok" = "1" ]; then
            echo "   ok (200)"
          else
            echo "::error::/api/rooms respondeu $code"
            cat /tmp/rooms.json || true
            fail=1
          fi

          if [ -n "${AUTH_ON:-}" ]; then
            # Estes dois confirmam a suposição de roteamento da Vercel que não
            # dá para verificar localmente: um arquivo de função casa com o
            # caminho EXATO dele, e o sub-caminho sobra para a captura
            # api/[...nest].ts. Se um dia deixar de valer, /api/rooms/directory
            # cairia na função errada — e o sintoma seria o diretório de salas
            # devolvendo a lista do LiveKit em silêncio.
            echo "5. /api/rooms/directory deve cair no serviço, não na função"
            code=$(curl -sS -o /tmp/dir.json -w '%{http_code}' --max-time 30 "$URL/api/rooms/directory")
            if [ "$code" = "200" ] && grep -q '"items"' /tmp/dir.json; then
              echo "   ok (200, formato de página)"
            else
              echo "::error::/api/rooms/directory respondeu $code"
              cat /tmp/dir.json || true
              fail=1
            fi

            echo "6. rota de administração deve exigir sessão"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL/api/admin/logs")
            if [ "$code" = "401" ]; then
              echo "   ok (401)"
            else
              echo "::error::/api/admin/logs respondeu $code, e deveria ser 401"
              fail=1
            fi
          else
            echo "5-6. autenticação desligada — pulando"
          fi

          echo "7. rota de API inexistente deve dar 404, não o HTML da SPA"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL/api/nada")
          if [ "$code" = "404" ]; then echo "   ok (404)"; else echo "::error::/api/nada respondeu $code"; fail=1; fi

          echo "### Deploy verificado" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

          exit $fail

  # Proxy TLS ÚNICO da VM (ver infra/docker-compose.proxy.yml) — compartilhado
  # entre o LiveKit e o mediasoup-sfu desde que o segundo processo passou a
  # dividir a mesma VM. Roda ANTES dos dois (needs em deploy-livekit e
  # deploy-mediasoup), porque cria a rede Docker externa "telecord-proxy" que
  # os outros dois compose esperam encontrar já criada.
  deploy-proxy:
    name: Publica o proxy TLS (VM)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      LIVEKIT_VM_SSH_KEY: ${{ secrets.LIVEKIT_VM_SSH_KEY || vars.LIVEKIT_VM_SSH_KEY }}
    steps:
      - name: Mascara a chave, se veio de variable em texto plano
        run: |
          if [ -n "${LIVEKIT_VM_SSH_KEY:-}" ]; then
            echo "::add-mask::$LIVEKIT_VM_SSH_KEY"
          fi

      - uses: actions/checkout@v5

      # Garante a pasta ANTES do scp, com o dono certo. Sem isto, a primeira
      # vez que este job roda numa VM nova o SCP falha calado com "Process
      # exited with status 1" se /opt/telecord-proxy não existir ainda ou já
      # existir com outro dono (ex.: criada à mão com `sudo mkdir` sem
      # `chown`) — mesmo padrão que já mordeu o setup manual do LiveKit, daí
      # `setup-vm.sh` fazer `sudo mkdir` + `sudo chown $USER` por lá. Aqui o
      # workflow deixa de depender de alguém lembrar de fazer isso à mão.
      - name: Garante a pasta de deploy na VM, com o dono certo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/telecord-proxy
            sudo chown "$(whoami)":"$(whoami)" /opt/telecord-proxy

      # MIGRAÇÃO ÚNICA: antes deste proxy compartilhado existir, o LiveKit
      # tinha seu PRÓPRIO Caddy (ver histórico de livekit/docker-compose.
      # prod.yml) segurando 80/443 sozinho. Numa VM que já tinha isso rodando
      # de um deploy anterior, o `docker compose up` do proxy novo falha com
      # "port is already allocated" — o Caddy antigo nunca chega a ser
      # substituído sozinho porque vive num compose diferente. `|| true`
      # porque numa VM nova (sem esse Caddy antigo) o `down` não tem o que
      # derrubar, e isso não pode falhar o job.
      - name: Derruba o Caddy antigo do LiveKit, se ainda existir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          script: |
            set -uo pipefail
            if [ -f /opt/telecord-livekit/docker-compose.prod.yml ]; then
              cd /opt/telecord-livekit
              docker compose -f docker-compose.prod.yml stop caddy || true
              docker compose -f docker-compose.prod.yml rm -f caddy || true
            fi
            exit 0

      - name: Copia os arquivos de deploy para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          source: 'infra/docker-compose.proxy.yml,infra/Caddyfile'
          target: /opt/telecord-proxy
          strip_components: 1

      # LIVEKIT_PUBLIC_HOST e MEDIASOUP_PUBLIC_HOST não são segredo (são só o
      # hostname nip.io público), então escrever o .env aqui — a partir do
      # Environment do GitHub, mesma fonte que `deploy-livekit` já usa para
      # verificar o deploy — é mais simples que depender de alguém preparar
      # esse arquivo à mão na VM antes do primeiro deploy.
      # O Caddyfile tem um site block por host (ver infra/Caddyfile) — se os
      # dois vierem iguais, o Caddy recusa subir com "ambiguous site
      # definition" e fica em crash-loop silencioso (foi o que aconteceu:
      # LIVEKIT_PUBLIC_HOST e MEDIASOUP_PUBLIC_HOST configurados com o MESMO
      # valor no Environment). Falhar aqui, ANTES de escrever o .env, dá um
      # erro claro no lugar de um 502 só descoberto minutos depois nos
      # healthchecks de LiveKit/mediasoup.
      - name: Confere que os dois hosts públicos são diferentes
        run: |
          if [ -z "${LIVEKIT_PUBLIC_HOST:-}" ] || [ -z "${MEDIASOUP_PUBLIC_HOST:-}" ]; then
            echo "::error::LIVEKIT_PUBLIC_HOST e MEDIASOUP_PUBLIC_HOST precisam estar definidos no Environment Production."
            exit 1
          fi
          if [ "$LIVEKIT_PUBLIC_HOST" = "$MEDIASOUP_PUBLIC_HOST" ]; then
            echo "::error::LIVEKIT_PUBLIC_HOST e MEDIASOUP_PUBLIC_HOST estão iguais ($LIVEKIT_PUBLIC_HOST) — o Caddy recusa subir com dois site blocks para o mesmo host. Use dois hosts nip.io distintos apontando para o mesmo IP (ex.: livekit-<ip>.nip.io e ms-<ip>.nip.io)."
            exit 1
          fi
        env:
          LIVEKIT_PUBLIC_HOST: ${{ secrets.LIVEKIT_PUBLIC_HOST || vars.LIVEKIT_PUBLIC_HOST }}
          MEDIASOUP_PUBLIC_HOST: ${{ secrets.MEDIASOUP_PUBLIC_HOST || vars.MEDIASOUP_PUBLIC_HOST }}

      - name: Escreve o .env do proxy na VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          envs: LIVEKIT_PUBLIC_HOST,MEDIASOUP_PUBLIC_HOST
          script: |
            set -euo pipefail
            cat > /opt/telecord-proxy/.env <<EOF2
            LIVEKIT_PUBLIC_HOST=$LIVEKIT_PUBLIC_HOST
            MEDIASOUP_PUBLIC_HOST=$MEDIASOUP_PUBLIC_HOST
            EOF2
        env:
          LIVEKIT_PUBLIC_HOST: ${{ secrets.LIVEKIT_PUBLIC_HOST || vars.LIVEKIT_PUBLIC_HOST }}
          MEDIASOUP_PUBLIC_HOST: ${{ secrets.MEDIASOUP_PUBLIC_HOST || vars.MEDIASOUP_PUBLIC_HOST }}

      - name: Sobe o proxy na VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/telecord-proxy
            docker compose -f docker-compose.proxy.yml up -d --remove-orphans

  # Servidor LiveKit self-host, numa VM à parte (Oracle Cloud) — desacoplado
  # do deploy da Vercel acima: um não depende do outro, e este só faz sentido
  # rodar quando algo em livekit/ muda.
  #
  # A VM não é provisionada por aqui: alguém já criou a instância e rodou
  # livekit/setup-vm.sh nela uma vez (Docker instalado, firewall aberto,
  # /opt/telecord-livekit criado com o .env preenchido). Este job só copia os
  # arquivos que definem o serviço e manda subir de novo.
  deploy-livekit:
    name: Publica o LiveKit (VM)
    # Só depois do proxy — nunca em paralelo com deploy-mediasoup: a VM é uma
    # E2.1.Micro com ~500MB de RAM real, e o `docker compose build` do
    # mediasoup (pnpm install + tsc + download do worker nativo) rodando ao
    # mesmo tempo que este `pull`/`up` do LiveKit esgota a memória da VM — foi
    # o que derrubou os dois jobs juntos (LiveKit com "couldn't connect",
    # mediasoup com build incompleto). Rodar em série custa alguns minutos a
    # mais por deploy; rodar em paralelo já derrubou o deploy inteiro.
    needs: [verify, deploy-proxy]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      # A chave privada de SSH deveria SEMPRE viver em `secrets` — como
      # `vars`, ela fica em texto plano e não é mascarada em log. O fallback
      # existe só para não travar quem colou no lugar errado sem perceber;
      # mova para Environment secrets assim que possível.
      LIVEKIT_VM_SSH_KEY: ${{ secrets.LIVEKIT_VM_SSH_KEY || vars.LIVEKIT_VM_SSH_KEY }}
    steps:
      - name: Mascara a chave, se veio de variable em texto plano
        run: |
          if [ -n "${LIVEKIT_VM_SSH_KEY:-}" ]; then
            echo "::add-mask::$LIVEKIT_VM_SSH_KEY"
          fi

      - uses: actions/checkout@v5

      - name: Copia os arquivos de deploy para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          source: 'livekit/docker-compose.prod.yml,livekit/livekit.yaml'
          target: /opt/telecord-livekit
          strip_components: 1

      - name: Sobe o serviço na VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          # O .env já mora na VM (feito manualmente uma vez, ver
          # livekit/setup-vm.sh) — nunca é escrito por este workflow, então
          # nenhuma credencial passa pelo runner do Actions.
          script: |
            set -euo pipefail
            cd /opt/telecord-livekit
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Verifica o deploy
        env:
          # O certificado TLS é emitido para LIVEKIT_PUBLIC_HOST (o domínio
          # nip.io), não para LIVEKIT_VM_HOST (o IP usado só para SSH) — são
          # duas variáveis diferentes de propósito, testar pelo IP bateria
          # num certificado que não é dele.
          HOST: ${{ secrets.LIVEKIT_PUBLIC_HOST || vars.LIVEKIT_PUBLIC_HOST }}
        run: |
          set -euo pipefail
          # "/" é o health check do LiveKit: sempre responde 200 "OK" quando o
          # processo está de pé e o Caddy repassou a requisição. `/rtc` SEM
          # query string na verdade responde 404 nesta versão — não é rota de
          # health check, é o próprio handshake WebSocket, que exige
          # access_token para dar qualquer resposta diferente de 404.
          #
          # Retry, não uma tentativa só: `docker compose up -d` no passo
          # anterior retorna assim que o container É CRIADO, não quando o
          # livekit-server já está de fato escutando em 7880 — o entrypoint
          # ainda precisa instalar gettext e rodar envsubst antes de subir o
          # binário. Uma curl imediata batia nisso com "couldn't connect"
          # (exit 7) e derrubava o job à toa, mesmo com o serviço subindo
          # normalmente alguns segundos depois.
          ok=0
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/rtc.json -w '%{http_code}' --max-time 10 "https://$HOST/" || echo 000)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            echo "tentativa $i: $code — aguardando o LiveKit subir…"
            sleep 3
          done
          if [ "$ok" = "1" ]; then
            echo "ok ($code)"
          else
            echo "::error::https://$HOST/ respondeu $code"
            cat /tmp/rtc.json || true
            exit 1
          fi
          echo "### LiveKit verificado" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$HOST" >> "$GITHUB_STEP_SUMMARY"

  # Processo mediasoup-sfu (transporte 'mediasoup') — mesma VM do LiveKit,
  # mesmo padrão de deploy desacoplado. `--build` porque, diferente do
  # LiveKit, a imagem aqui é NOSSA (mediasoup/Dockerfile), não um binário de
  # terceiro — não há o que dar `pull`.
  deploy-mediasoup:
    name: Publica o mediasoup-sfu (VM)
    # needs inclui deploy-livekit (não só deploy-proxy) de propósito: força
    # este job a esperar o LiveKit terminar de subir antes de começar o
    # `docker compose build` pesado do mediasoup na mesma VM — ver o
    # comentário em deploy-livekit sobre os ~500MB de RAM da VM.
    needs: [verify, deploy-proxy, deploy-livekit]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      LIVEKIT_VM_SSH_KEY: ${{ secrets.LIVEKIT_VM_SSH_KEY || vars.LIVEKIT_VM_SSH_KEY }}
    steps:
      - name: Mascara a chave, se veio de variable em texto plano
        run: |
          if [ -n "${LIVEKIT_VM_SSH_KEY:-}" ]; then
            echo "::add-mask::$LIVEKIT_VM_SSH_KEY"
          fi

      - uses: actions/checkout@v5

      # O Dockerfile builda a partir da RAIZ do repo (precisa de
      # packages/shared) — por isso o monorepo inteiro vai para a VM, não só
      # a pasta mediasoup/. Ainda assim é bem mais leve que node_modules do
      # workspace completo: só código-fonte.
      # Mesmo motivo do "Garante a pasta" em deploy-proxy: sem isto, a
      # primeira vez numa VM nova (ou uma pasta criada à mão sem chown) faz o
      # SCP falhar calado com "Process exited with status 1".
      - name: Garante a pasta de deploy na VM, com o dono certo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/telecord-mediasoup-src
            sudo chown "$(whoami)":"$(whoami)" /opt/telecord-mediasoup-src

      # O repositório inteiro vai para a VM (o Dockerfile builda com
      # `context: ../` a partir de mediasoup/, e precisa de packages/shared
      # ao lado).
      - name: Copia o repositório para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          source: '.'
          target: /opt/telecord-mediasoup-src

      # MEDIASOUP_ANNOUNCED_IP é o mesmo IP público da VM que já vale como
      # LIVEKIT_VM_HOST/LIVEKIT_NODE_IP — não precisa de um secret à parte.
      # MEDIASOUP_INTERNAL_SECRET é sensível de verdade; escrito aqui a
      # partir do Environment do GitHub, nunca commitado.
      - name: Escreve o .env do mediasoup-sfu na VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          envs: MEDIASOUP_INTERNAL_SECRET,MEDIASOUP_ANNOUNCED_IP
          script: |
            set -euo pipefail
            cat > /opt/telecord-mediasoup-src/mediasoup/.env <<EOF2
            MEDIASOUP_INTERNAL_SECRET=$MEDIASOUP_INTERNAL_SECRET
            MEDIASOUP_ANNOUNCED_IP=$MEDIASOUP_ANNOUNCED_IP
            EOF2
        env:
          MEDIASOUP_INTERNAL_SECRET: ${{ secrets.MEDIASOUP_INTERNAL_SECRET || vars.MEDIASOUP_INTERNAL_SECRET }}
          MEDIASOUP_ANNOUNCED_IP: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}

      - name: Builda a imagem e sobe o serviço na VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVEKIT_VM_HOST || vars.LIVEKIT_VM_HOST }}
          username: ${{ secrets.LIVEKIT_VM_USER || vars.LIVEKIT_VM_USER }}
          key: ${{ env.LIVEKIT_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/telecord-mediasoup-src/mediasoup
            docker compose -f docker-compose.prod.yml --env-file .env build
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans

      - name: Verifica o deploy
        env:
          HOST: ${{ secrets.MEDIASOUP_PUBLIC_HOST || vars.MEDIASOUP_PUBLIC_HOST }}
        run: |
          set -euo pipefail
          # Retry pelo mesmo motivo do healthcheck do LiveKit acima: `up -d`
          # retorna assim que o container sobe, não quando o processo Node já
          # está escutando em 3100.
          ok=0
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 10 "https://$HOST/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            echo "tentativa $i: $code — aguardando o mediasoup-sfu subir…"
            sleep 3
          done
          if [ "$ok" = "1" ]; then
            echo "ok ($code)"
          else
            echo "::error::https://$HOST/healthz respondeu $code"
            cat /tmp/health.json || true
            exit 1
          fi
          echo "### mediasoup-sfu verificado" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$HOST" >> "$GITHUB_STEP_SUMMARY"
